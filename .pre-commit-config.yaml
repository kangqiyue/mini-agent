default_install_hook_types: [pre-commit, commit-msg]

repos:
  - repo: https://github.com/gitleaks/gitleaks
    rev: 83d9cd684c87d95d656c1458ef04895a7f1cbd8e  # v8.30.1
    hooks:
      - id: gitleaks
      - id: gitleaks
        alias: gitleaks-commit-message
        name: Detect secrets in the commit message
        entry: gitleaks dir --redact --no-banner --no-color --config .gitleaks.toml
        stages: [commit-msg]
        pass_filenames: true

  - repo: local
    hooks:
      - id: repository-ruff
        name: Check all repository Python files with Ruff
        entry: uv run --no-sync ruff check .
        language: system
        stages: [pre-commit]
        always_run: true
        pass_filenames: false
      - id: public-tree-safety
        name: Reject private files and local identity leaks
        entry: python scripts/check_public_tree.py --staged
        language: system
        always_run: true
        pass_filenames: false
      - id: public-commit-message-safety
        name: Reject private information in the commit message
        entry: python scripts/check_public_tree.py --commit-message
        language: system
        stages: [commit-msg]
        pass_filenames: true
