name: Security

on:
  push:
  pull_request:
  workflow_dispatch:
  schedule:
    - cron: "17 4 * * 1"

permissions:
  contents: read

jobs:
  secrets:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Install verified Gitleaks release
        env:
          GITLEAKS_VERSION: "8.30.1"
          GITLEAKS_SHA256: "551f6fc83ea457d62a0d98237cbad105af8d557003051f41f3e7ca7b3f2470eb"
        run: |
          scan_dir="$RUNNER_TEMP/mini-agent-security"
          mkdir -p "$scan_dir"
          archive="gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz"
          curl --fail --silent --show-error --location --retry 3 \
            "https://github.com/gitleaks/gitleaks/releases/download/v${GITLEAKS_VERSION}/${archive}" \
            --output "$scan_dir/$archive"
          cd "$scan_dir"
          echo "$GITLEAKS_SHA256  $archive" | sha256sum --check --strict
          tar -xzf "$archive" gitleaks
          echo "$scan_dir" >> "$GITHUB_PATH"
      # Scan the checkout directly: no stale push base or PR API permissions.
      - name: Scan complete checked-out Git history for secrets
        run: gitleaks git . --log-opts="--all" --redact --no-banner --no-color --config .gitleaks.toml
      - name: Scan current file tree for secrets
        run: gitleaks dir . --redact --no-banner --no-color --config .gitleaks.toml
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"
      - name: Reject private files and machine-specific paths
        run: python scripts/check_public_tree.py --tracked
