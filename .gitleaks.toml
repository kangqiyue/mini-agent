title = "Mini Agent secret scanning"
minVersion = "v8.30.1"

[extend]
useDefault = true

[[rules]]
id = "credential-token-in-any-context"
description = "Detect high-confidence credential token shapes outside key-value content."
regex = '''(?i)(?:sk[_-]live[_-][a-z0-9_-]{20,}|github_pat_[a-z0-9_]{20,}|gh[pousr]_[a-z0-9]{20,}|xox[baprs]-[a-z0-9-]{20,}|akia[0-9a-z]{16}|aiza[a-z0-9_-]{30,})'''
